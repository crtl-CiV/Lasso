<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LASSO — Administrator Login</title>
<link rel="stylesheet" href="/lasso/assets/css/style.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <h1>LASSO Admin</h1>
    <p class="sub">Administrator sign-in</p>
    <div id="alertBox"></div>
    <form id="loginForm">
      <label>Admin ID</label>
      <input type="text" id="identifier" required placeholder="e.g. admin001">
      <label>Password</label>
      <input type="password" id="password" required>
      <button class="btn btn-primary btn-block" style="margin-top:18px;" type="submit">Log In</button>
    </form>
    <p class="switch-link"><a href="/lasso/index.html" style="color:var(--muted);">Student login</a></p>
    <p class="switch-link"><a href="/lasso/setup_admin.php" style="color:var(--muted); font-size:.78rem;">First time setup</a></p>
  </div>
</div>
<script src="/lasso/assets/js/api.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const identifier = document.getElementById('identifier').value.trim();
  const password = document.getElementById('password').value;
  const box = document.getElementById('alertBox');
  box.innerHTML = '';
  const r = await apiPost('/auth/login.php', { identifier, password, role: 'admin' });
  if (r.success) {
    window.location.href = '/lasso/admin/dashboard.html';
  } else {
    box.innerHTML = `<div class="alert alert-error">${r.message}</div>`;
  }
});
</script>
</body>
</html>

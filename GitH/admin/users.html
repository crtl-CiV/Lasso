<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users — LASSO Admin</title>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<div class="topbar">
  <div class="brand">LASSO Admin<span class="dot">.</span></div>
  <nav>
    <a href="/admin/dashboard.html">Dashboard</a>
    <a href="/admin/materials.html">Materials</a>
    <a href="/admin/users.html" class="active">Users</a>
    <a href="/admin/sales.html">Sales</a>
    <button onclick="logout('/index.html')">Logout</button>
  </nav>
</div>

<div class="page container">
  <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
    <h1>Manage User Accounts</h1>
    <button class="btn btn-gold" onclick="openNewAdminModal()">+ Register Admin</button>
  </div>

  <div class="tabs">
    <button class="active" onclick="switchTab('students', this)">Students</button>
    <button onclick="switchTab('admins', this)">Administrators</button>
    <button onclick="switchTab('requests', this)" id="requestsTab">Year Level Requests</button>
  </div>

  <div class="card">
    <table id="usersTable"></table>
  </div>
</div>

<div id="modalBackdrop" class="modal-backdrop" style="display:none;">
  <div class="modal" id="modalContent" style="max-width:700px;"></div>
</div>

<script src="/assets/js/api.js"></script>
<script>
let currentType = 'students';

async function init() {
  await requireAuth('admin');
  await loadUsers();
  refreshRequestCount();
}

function switchTab(type, btn) {
  currentType = type;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadUsers();
}

async function refreshRequestCount() {
  const r = await apiGet('/admin/year_requests_list.php');
  const n = r.success ? r.requests.length : 0;
  document.getElementById('requestsTab').textContent = n ? `Year Level Requests (${n})` : 'Year Level Requests';
}

async function loadUsers() {
  const table = document.getElementById('usersTable');
  if (currentType === 'requests') return loadRequests(table);

  const r = await apiGet(`/admin/users_list.php?type=${currentType}`);
  if (!r.success) { table.innerHTML = `<tr><td>${r.message}</td></tr>`; return; }

  if (currentType === 'students') {
    table.innerHTML = `<thead><tr><th>Student ID</th><th>Name</th><th>Course</th><th>Year/Section</th><th>Active Subs</th><th>Status</th><th></th></tr></thead>
      <tbody>${r.students.map(s => { studentCache[s.id] = s; return `
        <tr>
          <td>${esc(s.student_id_number)}</td>
          <td>${esc(s.full_name)}<div class="muted">${esc(s.university_email)}</div></td>
          <td>${esc(s.program_name || '—')}</td>
          <td>${esc(s.year_level)} - ${esc(s.section)}</td>
          <td>${s.active_subscriptions}</td>
          <td><span class="tag ${s.status === 'active' ? 'tag-active' : 'tag-trashed'}">${s.status}</span></td>
          <td style="white-space:nowrap;">
            <button class="btn btn-outline btn-sm" id="subbtn-${s.id}" onclick="toggleSubs(${s.id})">Subscriptions ▾</button>
            ${s.status === 'active'
              ? `<button class="btn btn-danger btn-sm" onclick="userAction(${s.id},'student','trash')">Trash</button>`
              : `<button class="btn btn-outline btn-sm" onclick="userAction(${s.id},'student','restore')">Restore</button>
                 <button class="btn btn-danger btn-sm" onclick="confirmUserDelete(${s.id},'student',${s.active_subscriptions})">Delete Permanently</button>`}
          </td>
        </tr>
        <tr id="subrow-${s.id}" style="display:none;"><td colspan="7" style="background:#f8fafc;"></td></tr>`; }).join('') || '<tr><td colspan="7" class="muted">No students yet.</td></tr>'}</tbody>`;
  } else {
    table.innerHTML = `<thead><tr><th>Admin ID</th><th>Name</th><th>Email</th><th>Position</th><th>Status</th><th></th></tr></thead>
      <tbody>${r.admins.map(a => `
        <tr>
          <td>${a.admin_id}</td>
          <td>${a.full_name}</td>
          <td>${a.email || '—'}</td>
          <td>${a.position}</td>
          <td><span class="tag ${a.status === 'active' ? 'tag-active' : 'tag-trashed'}">${a.status}</span></td>
          <td>
            ${a.status === 'active'
              ? `<button class="btn btn-danger btn-sm" onclick="userAction(${a.id},'admin','trash')">Trash</button>`
              : `<button class="btn btn-outline btn-sm" onclick="userAction(${a.id},'admin','restore')">Restore</button>
                 <button class="btn btn-danger btn-sm" onclick="confirmUserDelete(${a.id},'admin',0)">Delete Permanently</button>`}
          </td>
        </tr>`).join('') || '<tr><td colspan="6" class="muted">No administrators yet.</td></tr>'}</tbody>`;
  }
}

/* ---------- Year level requests ---------- */
async function loadRequests(table) {
  const r = await apiGet('/admin/year_requests_list.php?status=all');
  if (!r.success) { table.innerHTML = `<tr><td>${r.message}</td></tr>`; return; }
  const tag = { pending: 'tag-draft', approved: 'tag-active', rejected: 'tag-trashed' };
  table.innerHTML = `<thead><tr><th>Student</th><th>Change</th><th>Submitted</th><th>Status</th><th></th></tr></thead>
    <tbody>${r.requests.map(q => `
      <tr>
        <td>${q.full_name}<div class="muted">${q.student_id_number}</div></td>
        <td>${q.current_year_level} &rarr; <b>${q.requested_year_level}</b></td>
        <td>${new Date(q.created_at).toLocaleString()}</td>
        <td><span class="tag ${tag[q.status]}">${q.status}</span>
            ${q.status !== 'pending' ? `<div class="muted">by ${q.reviewed_by_name || '—'}${q.review_note ? ' — ' + q.review_note : ''}</div>` : ''}</td>
        <td style="white-space:nowrap;">
          <button class="btn btn-outline btn-sm" onclick="viewProof(${q.id})">View ID</button>
          ${q.status === 'pending' ? `
            <button class="btn btn-primary btn-sm" onclick="decideRequest(${q.id}, 'approve')">Approve</button>
            <button class="btn btn-danger btn-sm" onclick="decideRequest(${q.id}, 'reject')">Reject</button>` : ''}
        </td>
      </tr>`).join('') || '<tr><td colspan="5" class="muted">No year level requests yet.</td></tr>'}</tbody>`;
}

function viewProof(id) {
  document.getElementById('modalContent').innerHTML = `
    <h2>ID photo</h2>
    <img src="/api/admin/year_request_photo.php?id=${id}" alt="ID photo" style="width:100%; border-radius:8px; border:1px solid #e5e7eb;">
    <button class="btn btn-outline btn-block" style="margin-top:14px;" onclick="closeModal()">Close</button>`;
  document.getElementById('modalBackdrop').style.display = 'flex';
}

async function decideRequest(id, action) {
  let note = '';
  if (action === 'reject') {
    note = prompt('Reason for rejecting (shown to the student):') ;
    if (note === null) return;
  } else if (!confirm('Approve this request and update the student\'s year level?')) return;
  const r = await apiPost('/admin/year_request_action.php', { id, action, note });
  if (r.success) { toast(r.message, 'success'); loadUsers(); refreshRequestCount(); }
  else toast(r.message, 'error');
}

/* ---------- Student subscriptions (expandable row) ---------- */
const studentCache = {};
const subsData = {};

async function toggleSubs(id) {
  const row = document.getElementById('subrow-' + id);
  const btn = document.getElementById('subbtn-' + id);
  if (row.style.display !== 'none') { row.style.display = 'none'; btn.textContent = 'Subscriptions ▾'; return; }
  row.style.display = 'table-row';
  btn.textContent = 'Hide ▴';
  if (!row.dataset.loaded) {
    row.firstElementChild.innerHTML = '<div class="muted">Loading…</div>';
    const r = await apiGet(`/admin/subscription_status.php?student_id=${id}`);
    subsData[id] = r.success ? r.subscriptions : [];
    row.dataset.loaded = '1';
    renderSubs(id, 'all');
  }
}

function renderSubs(id, filter) {
  const s = studentCache[id];
  const all = subsData[id] || [];
  const active = all.filter(subIsActive);
  const shown = filter === 'active' ? active : filter === 'expired' ? all.filter(x => !subIsActive(x)) : all;
  const info = (label, value) => `<div><div class="muted" style="font-size:.72rem; text-transform:uppercase;">${label}</div><div style="font-weight:600;">${value || '—'}</div></div>`;

  document.getElementById('subrow-' + id).firstElementChild.innerHTML = `
    <div style="padding:6px 4px;">
      <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:14px;">
        ${info('Student ID', esc(s.student_id_number))}
        ${info('Email', esc(s.university_email))}
        ${info('Department', esc(s.department_name))}
        ${info('Course', esc(s.program_name))}
        ${info('Year / Section', esc(s.year_level) + ' - ' + esc(s.section))}
        ${info('Registered', s.created_at ? new Date(s.created_at).toLocaleDateString() : '')}
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:8px;">
        <b>Subscriptions — ${active.length} active, ${all.length - active.length} expired</b>
        <select onchange="renderSubs(${id}, this.value)" style="width:auto;">
          <option value="all" ${filter === 'all' ? 'selected' : ''}>Show all</option>
          <option value="active" ${filter === 'active' ? 'selected' : ''}>Active only</option>
          <option value="expired" ${filter === 'expired' ? 'selected' : ''}>Expired only</option>
        </select>
      </div>
      <div style="overflow-x:auto;">
      <table style="min-width:760px;">
        <thead><tr><th>Material</th><th>Accessible for</th><th>Subscribed</th><th>Expires</th><th>Time left</th><th>Terms</th><th>Total paid</th><th>Billing / OR</th><th>Status</th></tr></thead>
        <tbody>${shown.length ? shown.map(x => `
          <tr>
            <td>${esc(x.title)}<div class="muted">${esc(x.material_code)} • ${esc(x.author_name || '—')}</div></td>
            <td><span class="tag tag-year">${yearMaskLabel(x.year_mask)}</span> <span class="tag tag-sem">${semesterMaskLabel(x.semester_mask)}</span></td>
            <td>${esc(x.start_date)}</td>
            <td>${esc(x.expiry_date)}</td>
            <td>${durationText(x.expiry_date)}</td>
            <td>${x.semester_count}</td>
            <td>${peso(x.total_paid)}</td>
            <td>${esc(x.billing_code || '—')}<div class="muted">${x.receipt_number ? 'OR ' + esc(x.receipt_number) : ''}</div></td>
            <td><span class="tag ${subIsActive(x) ? 'tag-active' : 'tag-expired'}">${subIsActive(x) ? 'active' : 'expired'}</span></td>
          </tr>`).join('') : '<tr><td colspan="9" class="muted">No subscriptions to show.</td></tr>'}</tbody>
      </table></div>
    </div>`;
}

function confirmUserDelete(id, type, activeSubs) {
  const warn = type === 'student' && activeSubs > 0
    ? `WARNING: this student still has ${activeSubs} active subscription(s).\n\nDeleting the account permanently removes it together with their subscriptions, reading progress, billing records and uploaded photos. This cannot be undone.\n\nDelete it anyway?`
    : 'This will permanently delete this account and its files. This cannot be undone.\n\nDelete it?';
  if (confirm(warn)) userAction(id, type, 'delete', { force: true });
}

async function userAction(id, type, action, extra) {
  const r = await apiPost('/admin/users_action.php', Object.assign({ id, type, action }, extra || {}));
  if (r.success) { toast(r.message, 'success'); loadUsers(); }
  else toast(r.message, 'error');
}

function openNewAdminModal() {
  document.getElementById('modalContent').innerHTML = `
    <h2>Register Admin Account</h2>
    <form id="newAdminForm">
      <label>Admin ID</label><input type="text" id="na_id" required>
      <label>Email</label><input type="email" id="na_email" required placeholder="e.g. name@example.com">
      <label>Full Name</label><input type="text" id="na_name" required>
      <label>Position</label><input type="text" id="na_position" required>
      <label>Password</label><input type="password" id="na_password" minlength="8" required>
      <div id="naAlert"></div>
      <div style="display:flex; gap:10px; margin-top:14px;">
        <button type="button" class="btn btn-outline" style="flex:1;" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-gold" style="flex:1;">Create</button>
      </div>
    </form>`;
  document.getElementById('modalBackdrop').style.display = 'flex';

  document.getElementById('newAdminForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const r = await apiPost('/admin/register_admin.php', {
      admin_id: document.getElementById('na_id').value.trim(),
      email: document.getElementById('na_email').value.trim(),
      full_name: document.getElementById('na_name').value.trim(),
      position: document.getElementById('na_position').value.trim(),
      password: document.getElementById('na_password').value,
    });
    const box = document.getElementById('naAlert');
    if (r.success) { toast(r.message, 'success'); closeModal(); switchTab('admins', document.querySelectorAll('.tabs button')[1]); }
    else box.innerHTML = `<div class="alert alert-error">${r.message}</div>`;
  });
}

function closeModal() { document.getElementById('modalBackdrop').style.display = 'none'; }
document.getElementById('modalBackdrop').addEventListener('click', (e) => { if (e.target.id === 'modalBackdrop') closeModal(); });

init();
</script>
</body>
</html>

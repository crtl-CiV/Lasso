<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Materials — LASSO Admin</title>
<link rel="icon" type="image/svg+xml" href="/assets/img/logo-mark.svg">
<link rel="stylesheet" href="/assets/css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<div class="admin" id="adminRoot">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="scrim" onclick="toggleAdminNav()"></div>
  <div class="admin-main">
    <div class="admin-top" id="adminTop"></div>

    <div class="page-head">
      <div>
        <h1 class="page-title">Materials</h1>
        <p class="page-sub">Upload, publish and manage instructional materials.</p>
      </div>
      <button class="btn btn-primary" onclick="openUploadModal()"><span id="uploadIcon"></span> Upload material</button>
    </div>

    <div class="toolbar">
      <div class="tabs" id="statusTabs">
        <button class="active" onclick="switchTab('all', this)">All<span class="count" id="cntAll"></span></button>
        <button onclick="switchTab('published', this)">Published<span class="count" id="cntPublished"></span></button>
        <button onclick="switchTab('draft', this)">Drafts<span class="count" id="cntDraft"></span></button>
        <button onclick="switchTab('trashed', this)">Trash<span class="count" id="cntTrashed"></span></button>
      </div>
      <div class="search" style="margin-left:auto; max-width:340px;">
        <span id="searchIcon"></span>
        <input type="text" id="search" placeholder="Search title, author or code…" aria-label="Search materials">
      </div>
    </div>

    <div class="grid cols-3" id="grid"></div>
  </div>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/ui.js"></script>
<script>
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

let refs = { departments: [], programs: [] };
let currentStatus = 'all';

let allMaterials = [];

async function init() {
  const user = await requireAuth('admin');
  renderAdminShell('materials', user);
  document.getElementById('uploadIcon').innerHTML = icon('plus', 18);
  document.getElementById('searchIcon').innerHTML = icon('search', 18);
  document.getElementById('search').addEventListener('input', renderMaterials);
  const r = await apiGet('/reference_data.php');
  if (r.success) refs = r;
  await loadMaterials();
}

function switchTab(status, btn) {
  currentStatus = status;
  document.querySelectorAll('#statusTabs button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderMaterials();
}

function materialAdminCard(m) {
  const cover = m.cover_image ? `<img src="${SUPABASE_PUBLIC_URL}${esc(m.cover_image)}" alt="" loading="lazy">` : esc(m.title);
  const statusBadge = { draft: badge('neutral', 'Draft'), published: badge('success', 'Published'), trashed: badge('danger', 'Trashed') }[m.status];
  let actions = `<button class="btn btn-outline btn-sm" onclick='openEditModal(${JSON.stringify(m).replace(/'/g, "&#39;")})'>Edit</button>
    <button class="btn btn-outline btn-sm" onclick='openAddPagesModal(${m.id}, ${JSON.stringify(m.title).replace(/'/g, "&#39;")})'>Add pages</button>`;
  if (m.status === 'draft') actions += `<button class="btn btn-primary btn-sm" onclick="doAction(${m.id},'publish')">Publish</button>`;
  if (m.status === 'published') {
    actions += m.is_promoted
      ? `<button class="btn btn-outline btn-sm" onclick="doAction(${m.id},'unpromote')">Unfeature</button>`
      : `<button class="btn btn-outline btn-sm" onclick="doAction(${m.id},'promote')">${icon('star', 14)} Feature</button>`;
  }
  if (m.status === 'trashed') {
    actions += `<button class="btn btn-outline btn-sm" onclick="doAction(${m.id},'restore')">Restore</button>
      <button class="btn btn-danger btn-sm" onclick="confirmDelete(${m.id}, ${m.subscriber_count || 0})">Delete permanently</button>`;
  } else actions += `<button class="btn btn-danger btn-sm" onclick="doAction(${m.id},'trash')">${icon('trash', 14)} Trash</button>`;

  return `
    <div class="mcard">
      <div class="mcard-cover">${m.is_promoted ? badge('warning', 'Featured') : ''}${cover}</div>
      <div class="mcard-body">
        <div class="mcard-title">${esc(m.title)}</div>
        <div class="mcard-meta">${esc(m.author_name || '—')} · ${esc(m.subject_code || m.material_code)}</div>
        <div class="tags"><span class="badge badge-info">${esc(yearMaskLabel(m.year_mask))}</span><span class="badge badge-warning">${esc(semesterMaskLabel(m.semester_mask))}</span><span class="badge badge-brand" title="${esc((m.courses || []).map(c => c.name).join(', ') || 'Every course')}">${esc(courseLabel(m.courses))}</span>${statusBadge}</div>
        <div class="mcard-meta">${m.total_pages || 0} page(s) · ${m.subscriber_count} active subscriber(s)</div>
        <div class="mcard-foot"><span class="price">${peso(m.price)}</span></div>
        <div class="mcard-actions">${actions}</div>
      </div>
    </div>`;
}

async function loadMaterials() {
  const r = await apiGet('/admin/materials_list.php?status=all');
  const grid = document.getElementById('grid');
  if (!r.success) { grid.innerHTML = `<div class="empty-state">${esc(r.message)}</div>`; return; }
  allMaterials = r.materials;
  renderMaterials();
}

function renderMaterials() {
  const live = allMaterials.filter(m => m.status !== 'trashed');
  const count = (st) => allMaterials.filter(m => m.status === st).length;
  document.getElementById('cntAll').textContent = ` ${live.length}`;
  document.getElementById('cntPublished').textContent = ` ${count('published')}`;
  document.getElementById('cntDraft').textContent = ` ${count('draft')}`;
  document.getElementById('cntTrashed').textContent = ` ${count('trashed')}`;

  const q = document.getElementById('search').value.trim().toLowerCase();
  let list = currentStatus === 'all' ? live : allMaterials.filter(m => m.status === currentStatus);
  if (q) list = list.filter(m => [m.title, m.author_name, m.material_code, m.subject_code].some(v => String(v || '').toLowerCase().includes(q)));
  document.getElementById('grid').innerHTML = list.length ? list.map(materialAdminCard).join('') : '<div class="empty-state">No materials here.</div>';
}

function confirmDelete(id, activeSubs) {
  const warn = activeSubs > 0
    ? `WARNING: this material still has ${activeSubs} active subscriber(s).\n\nDeleting it permanently removes their access, their reading progress and the related sales records, together with the material's files. This cannot be undone.\n\nDelete it anyway?`
    : 'This will permanently delete this material and its files. This cannot be undone.\n\nDelete it?';
  if (confirm(warn)) doAction(id, 'delete', { force: true });
}

async function doAction(id, action, extra) {
  const r = await apiPost('/admin/materials_action.php', Object.assign({ id, action }, extra || {}));
  if (r.success) { toast(r.message, 'success'); loadMaterials(); }
  else toast(r.message, 'error');
}

// ---------------------------------------------------------
// "Visible to" picker: a Department dropdown (All departments, or tick one or more)
// and a Course dropdown listing only the courses of the ticked departments (all pre-ticked).
// No courses saved = every course may see the material.
// ---------------------------------------------------------
function coursePickerHtml(id, selectedIds) {
  const sel = (selectedIds || []).map(Number);
  const all = sel.length === 0;
  const deptOn = (d) => refs.programs.some(p => p.department_id == d.id && sel.includes(Number(p.id)));
  const deptOpts = refs.departments.map(d => `<label class="ms-opt"><input type="checkbox" class="cp-dept-box" value="${d.id}" ${deptOn(d) ? 'checked' : ''}> ${esc(d.name)}</label>`).join('');
  const groups = refs.departments.map(d => {
    const progs = refs.programs.filter(p => p.department_id == d.id);
    return `<div class="ms-group ${deptOn(d) ? '' : 'hidden'}" data-dept="${d.id}"><div class="ms-group-head">${esc(d.name)}</div>
      ${progs.length ? progs.map(p => `<label class="ms-opt"><input type="checkbox" class="cp-course-box" value="${p.id}" data-name="${esc(p.name)}" ${sel.includes(Number(p.id)) ? 'checked' : ''}> ${esc(p.name)}</label>`).join('')
        : '<div class="muted small ms-empty">No courses in this department yet.</div>'}</div>`;
  }).join('');
  return `<div class="course-picker form-row" id="${id}">
    <div><span class="sub-label">Department</span>
      <div class="ms" data-kind="dept">
        <button type="button" class="ms-btn" aria-haspopup="true" aria-expanded="false"><span class="ms-text"></span></button>
        <div class="ms-panel hidden">
          <label class="ms-opt ms-all"><input type="checkbox" class="cp-all-box" ${all ? 'checked' : ''}> <b>All departments</b></label>
          ${deptOpts}
        </div>
      </div>
    </div>
    <div><span class="sub-label">Course</span>
      <div class="ms" data-kind="course">
        <button type="button" class="ms-btn" aria-haspopup="true" aria-expanded="false"><span class="ms-text"></span></button>
        <div class="ms-panel hidden">${groups}</div>
      </div>
    </div>
  </div>`;
}

function bindCoursePicker(id) {
  const root = document.getElementById(id);
  const allBox = root.querySelector('.cp-all-box');
  const deptBoxes = [...root.querySelectorAll('.cp-dept-box')];
  const [deptMs, courseMs] = root.querySelectorAll('.ms');
  const close = (ms) => { ms.querySelector('.ms-panel').classList.add('hidden'); ms.querySelector('.ms-btn').setAttribute('aria-expanded', 'false'); };
  const refresh = () => {
    const depts = deptBoxes.filter(b => b.checked);
    root.querySelectorAll('.ms-group').forEach(g => g.classList.toggle('hidden', !depts.some(b => b.value === g.dataset.dept)));
    const names = depts.map(b => b.parentElement.textContent.trim());
    deptMs.querySelector('.ms-text').textContent = allBox.checked ? 'All departments'
      : !names.length ? 'Choose departments' : names.length <= 3 ? names.join(', ') : `${names.length} departments`;
    const courseBtn = courseMs.querySelector('.ms-btn');
    courseBtn.disabled = allBox.checked || !names.length;
    const shown = [...root.querySelectorAll('.ms-group:not(.hidden) .cp-course-box')], on = shown.filter(b => b.checked);
    courseMs.querySelector('.ms-text').textContent = allBox.checked ? 'All courses'
      : !names.length ? 'Choose a department first' : !on.length ? 'Choose courses'
      : on.length === shown.length ? `All courses (${shown.length})`
      : on.length <= 2 ? on.map(b => b.dataset.name).join(', ') : `${on.length} of ${shown.length} courses`;
    if (courseBtn.disabled) close(courseMs);
  };
  root.querySelectorAll('.ms').forEach(ms => ms.querySelector('.ms-btn').addEventListener('click', () => {
    const panel = ms.querySelector('.ms-panel'), opening = panel.classList.contains('hidden');
    root.querySelectorAll('.ms').forEach(close);
    if (opening) { panel.classList.remove('hidden'); ms.querySelector('.ms-btn').setAttribute('aria-expanded', 'true'); }
  }));
  // click anywhere else (or Esc) closes the open dropdown
  const outside = (e) => { if (!document.body.contains(root)) return document.removeEventListener('click', outside, true); if (!root.contains(e.target)) root.querySelectorAll('.ms').forEach(close); };
  document.addEventListener('click', outside, true);
  root.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.stopPropagation(); root.querySelectorAll('.ms').forEach(close); } });
  root.addEventListener('change', (e) => {
    const t = e.target;
    if (t === allBox && t.checked) {
      deptBoxes.forEach(b => { b.checked = false; });
      root.querySelectorAll('.cp-course-box').forEach(b => { b.checked = false; });
    } else if (t.classList.contains('cp-dept-box')) {
      if (t.checked) allBox.checked = false;
      root.querySelectorAll(`.ms-group[data-dept="${t.value}"] .cp-course-box`).forEach(b => { b.checked = t.checked; });   // a newly ticked department starts with all its courses ticked
    }
    refresh();
  });
  refresh();
}

/** 'all', or the ticked course ids; null (and an error toast unless quiet) when nothing usable is ticked. */
function readCoursePicker(id, quiet) {
  const root = document.getElementById(id);
  if (root.querySelector('.cp-all-box').checked) return 'all';
  const ids = [...root.querySelectorAll('.ms-group:not(.hidden) .cp-course-box:checked')].map(b => Number(b.value));
  if (!ids.length) { if (!quiet) toast('Under "Visible to", choose at least one department and course, or pick "All departments".', 'error'); return null; }
  return ids;
}

/** Short label for cards: "All courses", one name, or "N courses". */
function courseLabel(courses) {
  if (!courses || !courses.length) return 'All courses';
  return courses.length === 1 ? courses[0].name : `${courses.length} courses`;
}

// ---------------------------------------------------------
// Upload modal: two modes — PDF Document (auto page-split in the
// browser via pdf.js) or manual Page Images.
// ---------------------------------------------------------
function openUploadModal() {
  openModal(`
    ${modalHead('Upload instructional material', 'Fill in the details, tag who may access it, then add the file.')}
    <div class="tabs" style="margin-bottom:14px;">
      <button type="button" class="active" id="tabPdf" onclick="switchUploadMode('pdf')">PDF document</button>
      <button type="button" id="tabImages" onclick="switchUploadMode('images')">Page images</button>
    </div>
    <form id="uploadForm">
      <label>Title</label><input type="text" id="u_title" required>
      <div class="form-row">
        <div><label>Author</label><input type="text" id="u_author" required placeholder="e.g. Prof. A. Santos"></div>
        <div><label>Subject code <span class="muted">(optional)</span></label><input type="text" id="u_subject" maxlength="30" placeholder="e.g. IT 108"></div>
      </div>
      <label>Description</label><textarea id="u_description" rows="3"></textarea>
      <label>Visible to <span class="req">*</span> <span class="muted">(only students in the ticked courses will see this material)</span></label>
      ${coursePickerHtml('u_courses', [])}
      <div class="form-row">
        <div><label>Price (₱)</label><input type="number" id="u_price" min="0" step="0.01" required></div>
        <div></div>
      </div>
      <label>Accessible to year level(s) <span class="req">*</span> <span class="muted">(tick every year that may see this material)</span></label>
      ${tagCheckboxesHtml('u_years', YEAR_TAGS, [])}
      <label>Accessible during semester(s) <span class="req">*</span> <span class="muted">(hidden from students outside these)</span></label>
      ${tagCheckboxesHtml('u_sems', SEMESTER_TAGS, [])}

      <label>Cover image <span class="muted">(optional — the first PDF page is used if left blank)</span></label>
      <label class="dropzone" style="margin-top:0;">${icon('image', 22)}<span class="dz-title">Choose a cover image</span><span class="small">PNG or JPG</span><input type="file" id="u_cover" accept="image/*"></label>

      <div id="pdfModeFields">
        <label>PDF document</label>
        <label class="dropzone" style="margin-top:0;">${icon('upload', 22)}<span class="dz-title">Choose a PDF</span><span class="small">Pages are split in your browser</span><input type="file" id="u_pdf" accept="application/pdf"></label>
        <p class="muted" id="pdfInfo"></p>
      </div>
      <div id="imagesModeFields" style="display:none;">
        <label>Page images <span class="muted">(select in reading order, page 1 first)</span></label>
        <label class="dropzone" style="margin-top:0;">${icon('upload', 22)}<span class="dz-title">Choose page images</span><span class="small">You can select many at once</span><input type="file" id="u_pages" accept="image/*" multiple></label>
      </div>

      <label>Non-body pages <span class="muted">(comma-separated page numbers — cover, TOC, glossary, answer keys…)</span></label>
      <input type="text" id="u_nonbody" placeholder="e.g. 1,2,3,40,41">
      <div class="field-hint">These pages are hidden from the free 5-page preview and don't count toward reading progress.</div>

      <div id="uploadProgress" style="display:none; margin-top:14px;">
        <div class="progress"><span id="uploadProgressBar" style="width:0%;"></span></div>
        <p class="muted" id="uploadProgressText" style="margin-top:6px;"></p>
      </div>
      <div id="uploadAlert"></div>
      <div style="display:flex; gap:10px; margin-top:18px;">
        <button type="button" class="btn btn-outline" style="flex:1;" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary" style="flex:1;" id="uploadSubmitBtn">Upload</button>
      </div>
    </form>`, { wide: 680 });
  bindDropzones(document.getElementById('modalContent'));
  bindCoursePicker('u_courses');

  document.getElementById('u_pdf').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    const info = document.getElementById('pdfInfo');
    if (!f) { info.textContent = ''; return; }
    info.textContent = 'Reading document…';
    try {
      const pdf = await pdfjsLib.getDocument(await f.arrayBuffer()).promise;
      info.textContent = `${pdf.numPages} page(s) detected.`;
    } catch (err) {
      info.textContent = 'Could not read this file — please make sure it is a valid PDF.';
    }
  });

  document.getElementById('uploadForm').addEventListener('submit', handleUploadSubmit);
}

function switchUploadMode(mode) {
  document.getElementById('tabPdf').classList.toggle('active', mode === 'pdf');
  document.getElementById('tabImages').classList.toggle('active', mode === 'images');
  document.getElementById('pdfModeFields').style.display = mode === 'pdf' ? 'block' : 'none';
  document.getElementById('imagesModeFields').style.display = mode === 'images' ? 'block' : 'none';
  document.getElementById('uploadForm').dataset.mode = mode;
}

function commonFields() {
  const toArr = (s) => s.split(',').map(x => x.trim()).filter(Boolean).map(Number);
  return {
    title: document.getElementById('u_title').value.trim(),
    author_name: document.getElementById('u_author').value.trim(),
    subject_code: document.getElementById('u_subject').value.trim(),
    description: document.getElementById('u_description').value.trim(),
    program_ids: (ids => ids === 'all' ? 'all' : (ids ? ids.join(',') : ''))(readCoursePicker('u_courses', true)),
    year_levels: checkedTags('u_years').join(','),
    semesters: checkedTags('u_sems').join(','),
    price: document.getElementById('u_price').value,
    non_body_pages: JSON.stringify(toArr(document.getElementById('u_nonbody').value)),
  };
}

function setProgress(pct, text) {
  document.getElementById('uploadProgress').style.display = 'block';
  document.getElementById('uploadProgressBar').style.width = pct + '%';
  document.getElementById('uploadProgressText').textContent = text;
}

/** Render one PDF page to a JPEG Blob, capped at ~1400px wide to keep file size reasonable. */
async function renderPdfPageToBlob(pdf, pageNum) {
  const page = await pdf.getPage(pageNum);
  const baseViewport = page.getViewport({ scale: 1 });
  const targetWidth = 1400;
  const scale = Math.min(2, targetWidth / baseViewport.width);
  const viewport = page.getViewport({ scale });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport }).promise;
  return new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.82));
}

const UPLOAD_BATCH_SIZE = 8; // safely under PHP's default max_file_uploads (20)

async function handleUploadSubmit(e) {
  e.preventDefault();
  const box = document.getElementById('uploadAlert');
  box.innerHTML = '';
  const mode = document.getElementById('uploadForm').dataset.mode || 'pdf';
  const fields = commonFields();
  if (!fields.title || fields.price === '') { box.innerHTML = `<div class="alert alert-error">Title and price are required.</div>`; return; }
  if (!fields.year_levels) { box.innerHTML = `<div class="alert alert-error">Tag at least one year level this material is accessible for.</div>`; return; }
  if (!fields.semesters) { box.innerHTML = `<div class="alert alert-error">Tag at least one semester this material is accessible for.</div>`; return; }
  if (!fields.author_name) { box.innerHTML = `<div class="alert alert-error">Author is required.</div>`; return; }
  if (!fields.program_ids) { box.innerHTML = `<div class="alert alert-error">Under "Visible to", choose at least one department and course, or pick "All departments".</div>`; return; }

  const submitBtn = document.getElementById('uploadSubmitBtn');
  submitBtn.disabled = true;

  try {
    if (mode === 'images') {
      const files = document.getElementById('u_pages').files;
      if (!files.length) { box.innerHTML = `<div class="alert alert-error">Please choose at least one page image.</div>`; submitBtn.disabled = false; return; }
      const fd = new FormData();
      Object.entries(fields).forEach(([k, v]) => fd.append(k, v));
      const cover = document.getElementById('u_cover').files[0];
      if (cover) fd.append('cover_image', cover);
      for (const f of files) fd.append('pages[]', f);

      setProgress(50, 'Uploading…');
      const res = await fetch('/api/admin/materials_upload.php', { method: 'POST', body: fd, credentials: 'same-origin' });
      const r = await res.json();
      if (r.success) { setProgress(100, 'Done.'); toast(r.message, 'success'); closeModal(); loadMaterials(); }
      else box.innerHTML = `<div class="alert alert-error">${r.message}</div>`;
      submitBtn.disabled = false;
      return;
    }

    // ---- PDF mode ----
    const pdfFile = document.getElementById('u_pdf').files[0];
    if (!pdfFile) { box.innerHTML = `<div class="alert alert-error">Please choose a PDF file.</div>`; submitBtn.disabled = false; return; }

    setProgress(2, 'Reading document…');
    const pdf = await pdfjsLib.getDocument(await pdfFile.arrayBuffer()).promise;
    const numPages = pdf.numPages;

    // Step 1: create the material record first.
    const createFd = new FormData();
    Object.entries(fields).forEach(([k, v]) => createFd.append(k, v));
    createFd.append('expect_more_batches', '1');
    const manualCover = document.getElementById('u_cover').files[0];
    let firstPageBlob = null;
    if (!manualCover) {
      setProgress(4, `Rendering page 1 of ${numPages} for cover…`);
      firstPageBlob = await renderPdfPageToBlob(pdf, 1);
      createFd.append('cover_image', firstPageBlob, 'cover.jpg');
    } else {
      createFd.append('cover_image', manualCover);
    }

    let res = await fetch('/api/admin/materials_upload.php', { method: 'POST', body: createFd, credentials: 'same-origin' });
    let r = await res.json();
    if (!r.success) { box.innerHTML = `<div class="alert alert-error">${r.message}</div>`; submitBtn.disabled = false; return; }
    const materialId = r.material_id;

    // Step 2: render + upload pages in small batches.
    let batch = [];
    let uploaded = 0;
    for (let p = 1; p <= numPages; p++) {
      setProgress(5 + Math.round((p / numPages) * 90), `Processing page ${p} of ${numPages}…`);
      const blob = (p === 1 && firstPageBlob) ? firstPageBlob : await renderPdfPageToBlob(pdf, p);
      batch.push(blob);

      if (batch.length >= UPLOAD_BATCH_SIZE || p === numPages) {
        const batchFd = new FormData();
        batchFd.append('material_id', materialId);
        batch.forEach((b, i) => batchFd.append('pages[]', b, `page.jpg`));
        setProgress(5 + Math.round((p / numPages) * 90), `Uploading pages ${uploaded + 1}–${uploaded + batch.length} of ${numPages}…`);
        const bres = await fetch('/api/admin/materials_upload.php', { method: 'POST', body: batchFd, credentials: 'same-origin' });
        const br = await bres.json();
        if (!br.success) { box.innerHTML = `<div class="alert alert-error">Upload stopped: ${br.message} (material saved as draft with ${uploaded} page(s) so far — you can Add Pages later.)</div>`; submitBtn.disabled = false; loadMaterials(); return; }
        uploaded += batch.length;
        batch = [];
      }
    }

    setProgress(100, 'Done.');
    toast(`Uploaded ${uploaded} page(s).`, 'success');
    closeModal();
    loadMaterials();
  } catch (err) {
    box.innerHTML = `<div class="alert alert-error">Something went wrong: ${err.message}</div>`;
  }
  submitBtn.disabled = false;
}

// ---------------------------------------------------------
// Add Pages to an existing material (append more from a PDF or images)
// ---------------------------------------------------------
function openAddPagesModal(materialId, title) {
  openModal(`
    ${modalHead('Add pages', esc(title))}
    <div class="tabs" style="margin-bottom:14px;">
      <button type="button" class="active" id="apTabPdf" onclick="switchAddPagesMode('pdf')">From PDF</button>
      <button type="button" id="apTabImages" onclick="switchAddPagesMode('images')">From images</button>
    </div>
    <div id="apPdfFields">
      <label>PDF document</label>
      <label class="dropzone" style="margin-top:0;">${icon('upload', 22)}<span class="dz-title">Choose a PDF</span><input type="file" id="ap_pdf" accept="application/pdf"></label>
    </div>
    <div id="apImagesFields" style="display:none;">
      <label>Page images <span class="muted">(in order)</span></label>
      <label class="dropzone" style="margin-top:0;">${icon('upload', 22)}<span class="dz-title">Choose page images</span><input type="file" id="ap_pages" accept="image/*" multiple></label>
    </div>
    <div id="apProgress" style="display:none; margin-top:14px;">
      <div class="progress"><span id="apProgressBar" style="width:0%;"></span></div>
      <p class="muted" id="apProgressText" style="margin-top:6px;"></p>
    </div>
    <div id="apAlert"></div>
    <div style="display:flex; gap:10px; margin-top:18px;">
      <button type="button" class="btn btn-outline" style="flex:1;" onclick="closeModal()">Cancel</button>
      <button type="button" class="btn btn-primary" style="flex:1;" onclick="submitAddPages(${materialId})">Add pages</button>
    </div>`);
  bindDropzones(document.getElementById('modalContent'));
  document.getElementById('modalContent').dataset.mode = 'pdf';
}

function switchAddPagesMode(mode) {
  document.getElementById('apTabPdf').classList.toggle('active', mode === 'pdf');
  document.getElementById('apTabImages').classList.toggle('active', mode === 'images');
  document.getElementById('apPdfFields').style.display = mode === 'pdf' ? 'block' : 'none';
  document.getElementById('apImagesFields').style.display = mode === 'images' ? 'block' : 'none';
  document.getElementById('modalContent').dataset.mode = mode;
}

async function submitAddPages(materialId) {
  const mode = document.getElementById('modalContent').dataset.mode || 'pdf';
  const box = document.getElementById('apAlert');
  box.innerHTML = '';
  const setP = (pct, text) => {
    document.getElementById('apProgress').style.display = 'block';
    document.getElementById('apProgressBar').style.width = pct + '%';
    document.getElementById('apProgressText').textContent = text;
  };

  try {
    if (mode === 'images') {
      const files = document.getElementById('ap_pages').files;
      if (!files.length) { box.innerHTML = `<div class="alert alert-error">Please choose at least one image.</div>`; return; }
      const fd = new FormData();
      fd.append('material_id', materialId);
      for (const f of files) fd.append('pages[]', f);
      setP(50, 'Uploading…');
      const res = await fetch('/api/admin/materials_upload.php', { method: 'POST', body: fd, credentials: 'same-origin' });
      const r = await res.json();
      if (r.success) { toast(r.message, 'success'); closeModal(); loadMaterials(); }
      else box.innerHTML = `<div class="alert alert-error">${r.message}</div>`;
      return;
    }

    const pdfFile = document.getElementById('ap_pdf').files[0];
    if (!pdfFile) { box.innerHTML = `<div class="alert alert-error">Please choose a PDF file.</div>`; return; }
    setP(2, 'Reading document…');
    const pdf = await pdfjsLib.getDocument(await pdfFile.arrayBuffer()).promise;
    const numPages = pdf.numPages;

    let batch = [];
    let uploaded = 0;
    for (let p = 1; p <= numPages; p++) {
      setP(Math.round((p / numPages) * 95), `Processing page ${p} of ${numPages}…`);
      const blob = await renderPdfPageToBlob(pdf, p);
      batch.push(blob);
      if (batch.length >= UPLOAD_BATCH_SIZE || p === numPages) {
        const fd = new FormData();
        fd.append('material_id', materialId);
        batch.forEach(b => fd.append('pages[]', b, 'page.jpg'));
        const res = await fetch('/api/admin/materials_upload.php', { method: 'POST', body: fd, credentials: 'same-origin' });
        const r = await res.json();
        if (!r.success) { box.innerHTML = `<div class="alert alert-error">Stopped: ${r.message} (${uploaded} page(s) were saved.)</div>`; loadMaterials(); return; }
        uploaded += batch.length;
        batch = [];
      }
    }
    setP(100, 'Done.');
    toast(`Added ${uploaded} page(s).`, 'success');
    closeModal();
    loadMaterials();
  } catch (err) {
    box.innerHTML = `<div class="alert alert-error">Something went wrong: ${err.message}</div>`;
  }
}

function openEditModal(m) {
  openModal(`
    ${modalHead('Edit material', esc(m.material_code))}
    <form id="editForm">
      <label>Title</label><input type="text" id="e_title" value="${esc(m.title)}" required>
      <div class="form-row">
        <div><label>Author</label><input type="text" id="e_author" value="${esc(m.author_name || '')}" required></div>
        <div><label>Subject code <span class="muted">(optional)</span></label><input type="text" id="e_subject" maxlength="30" value="${esc(m.subject_code || '')}" placeholder="e.g. IT 108"></div>
      </div>
      <label>Description</label><textarea id="e_description" rows="3">${esc(m.description || '')}</textarea>
      <label>Visible to <span class="req">*</span> <span class="muted">(only students in the ticked courses will see this material)</span></label>
      ${coursePickerHtml('e_courses', (m.courses || []).map(c => c.id))}
      <div class="form-row">
        <div><label>Price (₱)</label><input type="number" id="e_price" min="0" step="0.01" value="${m.price}"></div>
        <div></div>
      </div>
      <label>Cover photo</label>
      <div class="edit-cover">
        <div class="edit-cover-now">${m.cover_image ? `<img src="${SUPABASE_PUBLIC_URL}${esc(m.cover_image)}" alt="Current cover">` : '<span class="muted small">No cover yet</span>'}<span class="small muted">Current</span></div>
        <label class="dropzone" style="margin-top:0; flex:1;">${icon('image', 22)}<span class="dz-title">Choose a new cover</span><span class="small">Optional — leave empty to keep the current one</span><input type="file" id="e_cover" accept="image/png,image/jpeg,image/webp"></label>
      </div>
      <label>Accessible to year level(s) <span class="req">*</span></label>
      ${tagCheckboxesHtml('e_years', YEAR_TAGS, maskToList(m.year_mask, 5))}
      <label>Accessible during semester(s) <span class="req">*</span></label>
      ${tagCheckboxesHtml('e_sems', SEMESTER_TAGS, maskToList(m.semester_mask, 2))}
      <div style="display:flex; gap:10px; margin-top:18px;">
        <button type="button" class="btn btn-outline" style="flex:1;" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary" style="flex:1;">Save</button>
      </div>
    </form>`, { wide: 640 });
  bindDropzones(document.getElementById('modalContent'));
  bindCoursePicker('e_courses');

  document.getElementById('editForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const programIds = readCoursePicker('e_courses'); if (programIds === null) return;
    const saveBtn = e.target.querySelector('button[type=submit]'); saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
    const r = await apiPost('/admin/materials_edit.php', {
      id: m.id,
      title: document.getElementById('e_title').value.trim(),
      author_name: document.getElementById('e_author').value.trim(),
      subject_code: document.getElementById('e_subject').value.trim(),
      description: document.getElementById('e_description').value.trim(),
      program_ids: programIds,
      year_levels: checkedTags('e_years'),
      semesters: checkedTags('e_sems'),
      price: document.getElementById('e_price').value,
    });
    if (!r.success) { saveBtn.disabled = false; saveBtn.textContent = 'Save'; toast(r.message, 'error'); return; }
    const cover = document.getElementById('e_cover').files[0];
    if (cover) {
      const fd = new FormData(); fd.append('id', m.id); fd.append('cover_image', cover);
      const c = await fetch('/api/admin/materials_cover.php', { method: 'POST', body: fd, credentials: 'same-origin' }).then(x => x.json()).catch(() => ({ success: false, message: 'Could not upload the cover.' }));
      if (!c.success) { toast('Details saved, but the cover was not updated: ' + c.message, 'error'); closeModal(); loadMaterials(); return; }
    }
    toast(r.message, 'success'); closeModal(); loadMaterials();
  });
}

init();
</script>

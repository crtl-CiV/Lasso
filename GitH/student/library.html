<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library — LASSO</title>
<link rel="icon" type="image/svg+xml" href="/assets/img/logo-mark.svg">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<header id="shell"></header>

<main class="page">
  <div class="page-head">
    <div>
      <h1 class="page-title">Library</h1>
      <p class="page-sub">Everything you are subscribed to, with your reading progress.</p>
    </div>
  </div>

  <div class="tabs" id="tabs" style="margin-bottom:20px;">
    <button class="active" data-tab="all">All<span class="count" id="cAll"></span></button>
    <button data-tab="active">Active<span class="count" id="cActive"></span></button>
    <button data-tab="expired">Expired<span class="count" id="cExpired"></span></button>
  </div>

  <div class="grid cols-3" id="grid"></div>
</main>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/ui.js"></script>
<script>
let library = [], tab = 'all';

async function init() {
  await requireAuth('student');
  renderStudentShell('library');
  await loadLibrary();
}

const live = (m) => subIsActive(m);

function libCard(m) {
  const active = live(m);
  const cover = m.cover_image ? `<img src="${SUPABASE_PUBLIC_URL}${esc(m.cover_image)}" alt="" loading="lazy">` : esc(m.title);
  return `
    <div class="mcard">
      <div class="mcard-cover" ${active ? `onclick="openReader(${m.material_id})" style="cursor:pointer;"` : ''}>
        ${badge(active ? 'success' : 'danger', active ? 'Active' : 'Expired')}${cover}
      </div>
      <div class="mcard-body">
        <div class="row-gap" style="justify-content:space-between; flex-wrap:nowrap;">
          <div class="mcard-title">${esc(m.title)}</div>
          <button type="button" class="iconbtn" style="width:30px; height:30px;" title="Subscription details" aria-label="Subscription details" onclick="showSubInfo(${m.material_id})">${icon('info', 18)}</button>
        </div>
        <div class="mcard-meta">${esc(m.subject_code || m.material_code)} · Renewed ${m.semester_count}x</div>
        <div class="progress"><span style="width:${Number(m.percent_complete) || 0}%;"></span></div>
        <div class="mcard-meta">${Math.round(m.percent_complete) || 0}% complete · ${active ? durationText(m.expiry_date) : 'Expired ' + fmtDate(m.expiry_date)}</div>
        <div class="mcard-actions" style="margin-top:auto; padding-top:6px;">
          ${active
            ? `<button class="btn btn-primary btn-sm btn-block" onclick="openReader(${m.material_id})">Continue reading</button>`
            : `<button class="btn btn-outline btn-sm btn-block" disabled>Access expired</button>`}
        </div>
      </div>
    </div>`;
}

function render() {
  const a = library.filter(live).length;
  document.getElementById('cAll').textContent = ` ${library.length}`;
  document.getElementById('cActive').textContent = ` ${a}`;
  document.getElementById('cExpired').textContent = ` ${library.length - a}`;
  const list = tab === 'active' ? library.filter(live) : tab === 'expired' ? library.filter(m => !live(m)) : library;
  const grid = document.getElementById('grid');
  if (!library.length) {
    grid.innerHTML = `<div class="empty-state"><p style="font-weight:600; color:var(--slate-900);">Your Library is empty.</p>
      <p style="margin:4px 0 14px;">Subscribe to materials from the Store and they will appear here once your receipt is approved.</p>
      <a class="btn btn-primary" href="/student/store.html">Go to Store</a></div>`;
    return;
  }
  grid.innerHTML = list.length ? list.map(libCard).join('') : `<div class="empty-state">Nothing here yet.</div>`;
}

async function loadLibrary() {
  const r = await apiGet('/subscription/library.php');
  if (!r.success) { document.getElementById('grid').innerHTML = `<div class="empty-state">${esc(r.message)}</div>`; return; }
  library = r.library;
  render();
}
document.getElementById('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  tab = b.dataset.tab;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('active', x === b));
  render();
});

/* ---------- subscription details (the info button) ---------- */
function showSubInfo(materialId) {
  const m = library.find(x => x.material_id === materialId); if (!m) return;
  const active = live(m);
  openModal(`
    ${modalHead('Subscription details', esc(m.title) + (m.author_name ? ' · ' + esc(m.author_name) : ''))}
    <table class="kv-table" style="min-width:0;">
      <tr><td>Status</td><td>${badge(active ? 'success' : 'danger', active ? 'Active' : 'Expired')}</td></tr>
      <tr><td>Subscribed on</td><td><b>${fmtDate(m.start_date)}</b></td></tr>
      <tr><td>Expires on</td><td><b>${fmtDate(m.expiry_date)}</b> <span class="muted">(${durationText(m.expiry_date)})</span></td></tr>
      <tr><td>Times renewed</td><td>${m.semester_count} (3 months each)</td></tr>
      <tr><td>Reading progress</td><td>${Math.round(m.percent_complete) || 0}%</td></tr>
      <tr><td>Last opened</td><td>${m.last_opened ? fmtDate(m.last_opened) : 'Not opened yet'}</td></tr>
      <tr><td>Billing code</td><td>${esc(m.billing_code || '—')}</td></tr>
    </table>
    <button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="closeModal()">Close</button>`);
}

/* ---------- reader (scrolling, with page sidebar — see openPageReader in ui.js) ---------- */
async function openReader(materialId) {
  const item = library.find(x => x.material_id === materialId);
  if (item && !live(item)) { toast('Your access to this material has expired.', 'error'); return; }
  const r = await apiGet(`/materials/get.php?id=${materialId}`);
  if (!r.success) { toast(r.message, 'error'); return; }
  const m = r.material;
  openPageReader({
    material: m, pages: m.accessible_pages, track: true, backLabel: 'Back to Library',
    startPage: item && item.last_page_read > 0 ? item.last_page_read : m.accessible_pages[0],
    percent: item ? Number(item.percent_complete) || 0 : 0,
    onClose: loadLibrary,
  });
}

init();
</script>
</body>
</html>

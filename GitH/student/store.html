<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store — LASSO</title>
<link rel="icon" type="image/svg+xml" href="/assets/img/logo-mark.svg">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<header id="shell"></header>

<main class="page">
  <div class="page-head">
    <div>
      <h1 class="page-title">Store</h1>
      <p class="page-sub">Browse instructional materials for your year level and the current semester.</p>
    </div>
  </div>

  <div class="toolbar">
    <div class="search">
      <span id="searchIcon"></span>
      <input type="text" id="search" placeholder="Search by title, author or code…" aria-label="Search">
    </div>
    <select id="programFilter" aria-label="Course"><option value="0">All courses</option></select>
  </div>

  <div class="chips" id="chips" style="margin-bottom:20px;">
    <button class="chip active" data-filter="all">All</button>
    <button class="chip" data-filter="featured">Featured</button>
  </div>

  <div class="grid" id="grid"></div>
</main>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/ui.js"></script>
<script>
let me = null, filter = 'all', searchTimer = null;

async function init() {
  me = await requireAuth('student');
  renderStudentShell('store');
  document.getElementById('searchIcon').innerHTML = icon('search', 18);
  await loadPrograms();
  await loadStore();
}

async function loadPrograms() {
  const r = await apiGet('/reference_data.php');
  if (!r.success) return;
  document.getElementById('programFilter').innerHTML =
    '<option value="0">All courses</option>' + r.programs.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
}

function materialCard(m) {
  const cover = m.cover_image ? `<img src="${SUPABASE_PUBLIC_URL}${esc(m.cover_image)}" alt="" loading="lazy">` : esc(m.title);
  let action;
  if (m.is_subscribed) action = `<a href="/student/library.html" class="btn btn-outline btn-sm" style="flex:1;">In Library</a>`;
  else if (m.in_cart) action = `<button class="btn btn-outline btn-sm" style="flex:1;" disabled>In cart</button>`;
  else action = `<button class="btn btn-primary btn-sm" style="flex:1;" onclick="addToCart(event, ${m.id})">Add to cart</button>`;

  return `
    <div class="mcard">
      <div class="mcard-cover" onclick="openMaterial(${m.id})" style="cursor:pointer;">
        ${m.is_promoted ? badge('warning', 'Featured') : ''}${cover}
      </div>
      <div class="mcard-body">
        <div class="mcard-title">${esc(m.title)}</div>
        <div class="mcard-meta">${esc(m.author_name || 'Unknown author')} · ${esc(m.subject_code || m.material_code)}</div>
        <div class="tags"><span class="badge badge-info">${esc(yearMaskLabel(m.year_mask))}</span><span class="badge badge-warning">${esc(semesterMaskLabel(m.semester_mask))}</span></div>
        <div class="mcard-foot"><span class="price">${peso(m.price)}</span></div>
        <div class="mcard-actions">
          <button class="btn btn-ghost btn-sm" style="flex:1;" onclick="openMaterial(${m.id})">${icon('eye', 16)} Preview</button>
          ${action}
        </div>
      </div>
    </div>`;
}

async function loadStore() {
  const search = document.getElementById('search').value.trim();
  const programId = document.getElementById('programFilter').value;
  const r = await apiGet(`/materials/list.php?search=${encodeURIComponent(search)}&program_id=${programId}${filter === 'featured' ? '&featured=1' : ''}`);
  const grid = document.getElementById('grid');
  if (!r.success) { grid.innerHTML = `<div class="empty-state">${esc(r.message)}</div>`; return; }
  if (!r.materials.length) {
    grid.innerHTML = r.current_term === 'Summer Term'
      ? `<div class="empty-state">No semester is in session right now (Summer Term). Materials come back when the next semester starts — anything you already subscribed to stays in your Library.</div>`
      : `<div class="empty-state">No materials found. Materials are shown only for your year level and the current semester.</div>`;
    return;
  }
  grid.innerHTML = r.materials.map(materialCard).join('');
}

document.getElementById('chips').addEventListener('click', (e) => {
  const c = e.target.closest('.chip'); if (!c) return;
  filter = c.dataset.filter;
  document.querySelectorAll('#chips .chip').forEach(x => x.classList.toggle('active', x === c));
  loadStore();
});
document.getElementById('search').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(loadStore, 250); });
document.getElementById('programFilter').addEventListener('change', loadStore);

async function addToCart(e, id) {
  e.stopPropagation();
  const r = await apiPost('/cart/add.php', { material_id: id });
  if (r.success) { toast('Added to cart', 'success'); refreshCartBadge(); loadStore(); }
  else toast(r.message, 'error');
}

let previewMaterial = null;
function openPreview() {
  const m = previewMaterial; if (!m) return;
  closeModal();
  openPageReader({
    material: m, pages: m.accessible_pages, track: false, preview: !m.is_subscribed, backLabel: 'Back to Store',
    footer: m.is_subscribed ? '' : `<div class="reader-end">End of the free preview. <button class="btn btn-primary btn-sm" onclick="closePageReader(); addToCartAndClose(${m.id})">Add to cart</button></div>`,
  });
}

async function openMaterial(id) {
  const r = await apiGet(`/materials/get.php?id=${id}`);
  if (!r.success) { toast(r.message, 'error'); return; }
  const m = r.material; previewMaterial = m;
  openModal(`
    ${modalHead(esc(m.title), `${esc(m.author_name || 'Unknown author')} · ${esc(m.subject_code || m.material_code)}`)}
    <div class="tags" style="margin-bottom:12px;"><span class="badge badge-info">${esc(yearMaskLabel(m.year_mask))}</span><span class="badge badge-warning">${esc(semesterMaskLabel(m.semester_mask))}</span></div>
    <p class="muted" style="margin-bottom:10px;">For: ${m.courses && m.courses.length ? esc(m.courses.map(c => c.name).join(', ')) : 'All courses'}</p>
    ${m.description ? `<p style="margin-bottom:12px;">${esc(m.description)}</p>` : ''}
    <p style="margin-bottom:8px;"><b class="price">${peso(m.price)}</b> <span class="muted">· ${m.body_page_count} body pages · 3 months of access</span></p>
    ${m.is_subscribed
      ? '<div class="alert alert-success">You are subscribed to this material.</div>'
      : `<div class="alert alert-info">Limited preview: ${m.accessible_pages.length} of ${m.body_page_count} body pages shown. Subscribe for full access.</div>`}
    ${m.accessible_pages.length
      ? `<button class="btn btn-outline btn-block" onclick="openPreview()">${icon('eye', 16)} ${m.is_subscribed ? 'Open material' : `Read the preview (${m.accessible_pages.length} page${m.accessible_pages.length === 1 ? '' : 's'})`}</button>`
      : '<p class="muted">No preview pages available yet.</p>'}
    <div style="display:flex; gap:10px; margin-top:16px;">
      <button class="btn btn-outline" style="flex:1;" onclick="closeModal()">Close</button>
      ${!m.is_subscribed ? `<button class="btn btn-primary" style="flex:1;" onclick="addToCartAndClose(${m.id})">Add to cart</button>` : ''}
    </div>`, { wide: 700 });
}

async function addToCartAndClose(id) {
  const r = await apiPost('/cart/add.php', { material_id: id });
  if (r.success) { toast('Added to cart', 'success'); refreshCartBadge(); closeModal(); loadStore(); }
  else toast(r.message, 'error');
}

init();
</script>
</body>
</html>

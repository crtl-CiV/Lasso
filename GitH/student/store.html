<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store — LASSO</title>
<link rel="stylesheet" href="/lasso/assets/css/style.css">
</head>
<body>
<div class="topbar">
  <div class="brand">LASSO<span class="dot">.</span></div>
  <nav>
    <a href="/lasso/student/store.html" class="active">Store</a>
    <a href="/lasso/student/cart.html">Cart<span class="badge-count" id="cartBadge" style="display:none;">0</span></a>
    <a href="/lasso/student/library.html">Library</a>
    <a href="/lasso/student/profile.html">Profile</a>
    <button onclick="logout()">Logout</button>
  </nav>
</div>

<div class="page container">
  <h1>Store</h1>
  <p class="muted">Browse instructional materials available for your program.</p>

  <div class="card" style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;">
    <div style="flex:1; min-width:200px;">
      <label>Search</label>
      <input type="text" id="search" placeholder="Search by title or code...">
    </div>
    <div style="min-width:200px;">
      <label>Program</label>
      <select id="programFilter"><option value="0">All programs</option></select>
    </div>
    <button class="btn btn-primary" onclick="loadStore()">Filter</button>
  </div>

  <div id="grid" class="grid grid-3"></div>
</div>

<!-- Material detail / preview modal -->
<div id="modalBackdrop" class="modal-backdrop" style="display:none;">
  <div class="modal" id="modalContent"></div>
</div>

<script src="/lasso/assets/js/api.js"></script>
<script>
let me = null;

async function init() {
  me = await requireAuth('student');
  await loadPrograms();
  await refreshCartBadge();
  await loadStore();
}

async function loadPrograms() {
  const r = await apiGet('/reference_data.php');
  if (!r.success) return;
  document.getElementById('programFilter').innerHTML =
    '<option value="0">All programs</option>' + r.programs.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
}

async function refreshCartBadge() {
  const r = await apiGet('/cart/list.php');
  const badge = document.getElementById('cartBadge');
  if (r.success && r.items.length) { badge.style.display = 'inline-block'; badge.textContent = r.items.length; }
  else badge.style.display = 'none';
}

function materialCard(m) {
  const cover = m.cover_image ? `<img src="/lasso/api/${m.cover_image}" alt="">` : m.title;
  let actionBtn;
  if (m.is_subscribed) actionBtn = `<a href="/lasso/student/library.html" class="btn btn-outline btn-sm">In Library</a>`;
  else if (m.in_cart) actionBtn = `<button class="btn btn-outline btn-sm" disabled>In Cart</button>`;
  else actionBtn = `<button class="btn btn-gold btn-sm" onclick="addToCart(event, ${m.id})">Add to Cart</button>`;

  return `
    <div class="mcard">
      <div class="cover" onclick="openMaterial(${m.id})" style="cursor:pointer;">
        ${m.is_promoted ? '<span class="promoted-tag">Featured</span>' : ''}
        ${cover}
      </div>
      <div class="body">
        <div class="title">${m.title}</div>
        <div class="meta">${m.material_code} • ${m.program_name || 'General'}</div>
        <div class="price">${peso(m.price)}</div>
      </div>
      <div class="actions">
        <button class="btn btn-outline btn-sm" style="flex:1;" onclick="openMaterial(${m.id})">Preview</button>
        ${actionBtn}
      </div>
    </div>`;
}

async function loadStore() {
  const search = document.getElementById('search').value.trim();
  const programId = document.getElementById('programFilter').value;
  const r = await apiGet(`/materials/list.php?search=${encodeURIComponent(search)}&program_id=${programId}`);
  const grid = document.getElementById('grid');
  if (!r.success) { grid.innerHTML = `<div class="empty-state">${r.message}</div>`; return; }
  if (!r.materials.length) { grid.innerHTML = `<div class="empty-state">No materials found.</div>`; return; }
  grid.innerHTML = r.materials.map(materialCard).join('');
}

async function addToCart(e, id) {
  e.stopPropagation();
  const r = await apiPost('/cart/add.php', { material_id: id });
  if (r.success) { toast('Added to cart', 'success'); refreshCartBadge(); loadStore(); }
  else toast(r.message, 'error');
}

async function openMaterial(id) {
  const r = await apiGet(`/materials/get.php?id=${id}`);
  if (!r.success) { toast(r.message, 'error'); return; }
  const m = r.material;
  const pagesHtml = m.accessible_pages.map(p =>
    `<img class="viewer-page-img protected" loading="lazy" src="/lasso/api/materials/view_page.php?material_id=${m.id}&page=${p}">`
  ).join('');

  document.getElementById('modalContent').innerHTML = `
    <h2>${m.title}</h2>
    <p class="muted">${m.material_code} • ${m.department_name || ''} ${m.program_name ? '• ' + m.program_name : ''}</p>
    <p>${m.description || ''}</p>
    <p><b>${peso(m.price)}</b> &middot; ${m.body_page_count} body pages</p>
    ${m.is_subscribed
      ? '<div class="alert alert-success">You are subscribed to this material.</div>'
      : `<div class="alert alert-info">Limited preview: ${m.accessible_pages.length} of ${m.body_page_count} body pages shown. Subscribe for full access.</div>`}
    <div class="protected" style="max-height:50vh; overflow:auto; border:1px solid #e5e7eb; border-radius:8px; padding:8px;">
      ${pagesHtml || '<p class="muted">No preview pages available yet.</p>'}
    </div>
    <div style="display:flex; gap:10px; margin-top:16px;">
      <button class="btn btn-outline" style="flex:1;" onclick="closeModal()">Close</button>
      ${!m.is_subscribed ? `<button class="btn btn-gold" style="flex:1;" onclick="addToCartAndClose(${m.id})">Add to Cart</button>` : ''}
    </div>
  `;
  document.getElementById('modalBackdrop').style.display = 'flex';
}

async function addToCartAndClose(id) {
  const r = await apiPost('/cart/add.php', { material_id: id });
  if (r.success) { toast('Added to cart', 'success'); refreshCartBadge(); closeModal(); loadStore(); }
  else toast(r.message, 'error');
}

function closeModal() { document.getElementById('modalBackdrop').style.display = 'none'; }
document.getElementById('modalBackdrop').addEventListener('click', (e) => { if (e.target.id === 'modalBackdrop') closeModal(); });

init();
</script>
</body>
</html>

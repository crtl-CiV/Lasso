<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — LASSO</title>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="auth">
<a class="auth-logo" href="/index.html"><span class="brand-mark">L</span>LASSO</a>
<div class="auth-wrap">
  <div class="login-card">
    <h1>Welcome back</h1>
    <p class="page-sub">Log in with your university email.</p>
    <div id="alertBox"></div>
    <form id="loginForm">
      <label for="identifier">Email</label>
      <input type="text" id="identifier" required autocomplete="username" placeholder="e.g. juan.delacruz@students.isatu.edu.ph">
      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password" placeholder="Your password">
      <button class="btn btn-primary btn-block" style="margin-top:24px; padding:13px;" type="submit" id="loginBtn">Log in</button>
    </form>
    <p class="auth-foot">No account yet? <a href="/register.html"><b>Register</b></a></p>
  </div>
</div>
<script src="/assets/js/api.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const box = document.getElementById('alertBox'), btn = document.getElementById('loginBtn');
  box.innerHTML = ''; btn.disabled = true; btn.textContent = 'Logging in…';
  const r = await apiPost('/auth/login.php', {
    identifier: document.getElementById('identifier').value.trim(),
    password: document.getElementById('password').value,
  });
  if (r.success) {
    window.location.href = r.user.role === 'admin' ? '/admin/dashboard.html' : '/student/store.html';
  } else {
    btn.disabled = false; btn.textContent = 'Log in';
    box.innerHTML = `<div class="alert alert-error">${esc(r.message)}</div>`;
  }
});
</script>
</body>
</html>
